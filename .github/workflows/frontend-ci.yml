name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
      - "integration/**"
  pull_request:
    branches:
      - main
      - dev
      - "codex/**"
      - "feat/**"
      - "feature/**"
      - "integration/**"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - ".env*"
              - ".github/workflows/ci.yml"
              - ".github/workflows/frontend-ci.yml"
              - "apps/web/**"
              - "package.json"
              - "packages/contracts/**"
              - "packages/workflow-engine/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "tsconfig.base.json"

  frontend-unit:
    name: Frontend Unit (${{ matrix.shard }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "1/8"
          - "2/8"
          - "3/8"
          - "4/8"
          - "5/8"
          - "6/8"
          - "7/8"
          - "8/8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend (unit)
        run: pnpm --filter @chatai/web test:unit --shard=${{ matrix.shard }}

  frontend-integration:
    name: Frontend Integration (${{ matrix.test }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - "chat-workbench-composer.int.test.tsx"
          - "chat-workbench-sidebar.int.test.tsx"
          - "chat-workbench-downloads.int.test.tsx"
          - "chat-workbench-session.int.test.tsx"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend (integration)
        working-directory: apps/web
        run: VITEST_TEST_GROUP=integration ./node_modules/.bin/vitest run --config vitest.config.ts test/pages/chat/${{ matrix.test }}

  frontend-verify:
    name: Frontend Verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @chatai/web typecheck

      - name: Build frontend
        run: pnpm --filter @chatai/web build

  frontend:
    name: Frontend
    needs:
      - changes
      - frontend-unit
      - frontend-integration
      - frontend-verify
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check frontend jobs
        run: |
          echo "Frontend Unit: ${{ needs.frontend-unit.result }}"
          echo "Frontend Integration: ${{ needs.frontend-integration.result }}"
          echo "Frontend Verify: ${{ needs.frontend-verify.result }}"

          if [[ "${{ needs.frontend-unit.result }}" != "success" || "${{ needs.frontend-integration.result }}" != "success" || "${{ needs.frontend-verify.result }}" != "success" ]]; then
            exit 1
          fi
