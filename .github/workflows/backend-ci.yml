name: Backend CI

on:
  push:
    branches:
      - main
      - dev
      - "integration/**"
  pull_request:
    branches:
      - main
      - dev
      - "codex/**"
      - "feat/**"
      - "feature/**"
      - "integration/**"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Backend Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - ".env*"
              - ".github/workflows/backend-ci.yml"
              - ".github/workflows/ci.yml"
              - "apps/backend/**"
              - "apps/workflow-worker/**"
              - "package.json"
              - "packages/contracts/**"
              - "packages/workflow-engine/**"
              - "packages/workflow-runtime/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "tsconfig.base.json"
  backend:
    name: Backend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_HOST: "%"
          MYSQL_ROOT_PASSWORD: workflow-test
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pworkflow-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @chatai/contracts exec tsc -p tsconfig.json

      - name: Build workflow engine
        run: pnpm --filter @chatai/workflow-engine exec tsc -p tsconfig.json

      - name: Build workflow runtime
        run: pnpm --filter @chatai/workflow-runtime exec tsc -p tsconfig.json

      - name: Build workflow worker
        run: pnpm --filter @chatai/workflow-worker exec tsc -p tsconfig.json

      - name: Build backend
        run: pnpm --filter @chatai/backend exec tsc -p tsconfig.json

      - name: Test contracts
        run: pnpm --filter @chatai/contracts test

      - name: Test workflow engine
        run: pnpm --filter @chatai/workflow-engine test

      - name: Test workflow runtime
        run: pnpm --filter @chatai/workflow-runtime test

      - name: Test workflow runtime MySQL repository
        run: pnpm --filter @chatai/workflow-runtime test:repository:mysql
        env:
          WORKFLOW_TEST_MYSQL_HOST: 127.0.0.1
          WORKFLOW_TEST_MYSQL_PASSWORD: workflow-test
          WORKFLOW_TEST_MYSQL_PORT: 3306
          WORKFLOW_TEST_MYSQL_USER: root

      - name: Test workflow worker
        run: pnpm --filter @chatai/workflow-worker test

      - name: Test backend
        run: pnpm backend:test

      - name: Verify workflow worker production imports
        run: pnpm --filter @chatai/workflow-worker verify:production-imports
