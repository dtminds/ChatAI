name: Workflow Worker Image CI

on:
  push:
    branches:
      - main
      - dev
      - "integration/**"
    paths:
      - ".github/workflows/workflow-worker-image-ci.yml"
      - "deploy/workflow-worker.Dockerfile"
      - "apps/workflow-worker/package.json"
      - "package.json"
      - "packages/contracts/package.json"
      - "packages/workflow-engine/package.json"
      - "packages/workflow-runtime/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches:
      - main
      - dev
      - "codex/**"
      - "feat/**"
      - "feature/**"
      - "integration/**"
    paths:
      - ".github/workflows/workflow-worker-image-ci.yml"
      - "deploy/workflow-worker.Dockerfile"
      - "apps/workflow-worker/package.json"
      - "package.json"
      - "packages/contracts/package.json"
      - "packages/workflow-engine/package.json"
      - "packages/workflow-runtime/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: workflow-worker-image-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-worker-image:
    name: Workflow Worker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build workflow worker image
        run: docker build -f deploy/workflow-worker.Dockerfile -t chatai-workflow-worker:ci .

      - name: Verify workflow worker Pulsar binding
        run: docker run --rm --workdir /app/apps/workflow-worker chatai-workflow-worker:ci node --input-type=module -e "await import('pulsar-client')"
