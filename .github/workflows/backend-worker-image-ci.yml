name: Backend Worker Image CI

on:
  push:
    branches:
      - main
      - dev
      - "integration/**"
    paths:
      - ".github/workflows/backend-worker-image-ci.yml"
      - "deploy/backend-worker.Dockerfile"
      - "apps/backend-worker/package.json"
      - "package.json"
      - "packages/contracts/package.json"
      - "packages/database/package.json"
      - "packages/insights/package.json"
      - "packages/tickets/package.json"
      - "packages/user-memory/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches:
      - main
      - dev
      - "codex/**"
      - "feat/**"
      - "feature/**"
      - "integration/**"
    paths:
      - ".github/workflows/backend-worker-image-ci.yml"
      - "deploy/backend-worker.Dockerfile"
      - "apps/backend-worker/package.json"
      - "package.json"
      - "packages/contracts/package.json"
      - "packages/database/package.json"
      - "packages/insights/package.json"
      - "packages/tickets/package.json"
      - "packages/user-memory/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: backend-worker-image-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-worker-image:
    name: Backend Worker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Backend Worker image
        run: docker build -f deploy/backend-worker.Dockerfile -t chatai-backend-worker:ci .

      - name: Verify Backend Worker module graph
        run: >-
          docker run --rm --entrypoint node --workdir /app/apps/backend-worker chatai-backend-worker:ci
          --input-type=module -e
          "await import('@chatai/database'); await import('@chatai/insights'); await import('@chatai/user-memory')"
